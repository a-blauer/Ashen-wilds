# Renders the intro cinematic video on GitHub Actions (owner's request, Oct 26 2026): tools/render.sh starts it and fetches
# the result. The video is drawn in 5-second pieces, all at the same time, each by its own job; only the pieces asked for
# are drawn again, the rest come from the last render (kept in the Actions cache, so nothing big lands in the repo).
#   - push to render/intro (tools/render.sh does it, with a .render-request file naming the time ranges to draw)
#   - result: out/intro.mp4 pushed to the short-lived branch render-out/intro (tools/render.sh downloads it, then deletes
#     the branch); the session workspace can't download Actions artifacts, only git and annotations.
# Runners are pinned to ubuntu-24.04 like tests.yml.
name: Render intro
on:
  push:
    branches: ['render/**']
concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
env:
  FPS: '24'
  W: '1280'
  H: '720'
  SEG: '120'
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      segs: ${{ steps.p.outputs.segs }}
      n: ${{ steps.p.outputs.n }}
      nseg: ${{ steps.p.outputs.nseg }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with: {path: segs, key: intro-segs-none, restore-keys: intro-segs-}
      - id: p
        run: python3 tools/render_plan.py >> "$GITHUB_OUTPUT"
  render:
    needs: plan
    if: needs.plan.outputs.segs != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        seg: ${{ fromJSON(needs.plan.outputs.segs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: .github/workflows/render.yml}
      - name: Cache Chromium
        uses: actions/cache@v4
        with: {path: ~/.cache/ms-playwright, key: pw-chromium-v1}
      - name: Install Playwright + Chromium + ffmpeg
        timeout-minutes: 25
        run: |
          pip install playwright pillow numpy scipy imageio-ffmpeg
          # the system installer can wait a long time for a lock on a fresh runner: give each try 8 minutes, three tries
          for i in 1 2 3; do timeout 8m python -m playwright install --with-deps chromium && break; echo "::warning::browser install try $i timed out"; sleep 5; done
          mkdir -p ~/bin && ln -sf "$(python -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')" ~/bin/ffmpeg && echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Build
        run: ./build.sh
      - name: Draw piece ${{ matrix.seg }}
        run: |
          f0=$(( ${{ matrix.seg }} * SEG )); f1=$(( f0 + SEG )); n=${{ needs.plan.outputs.n }}; [ $f1 -gt $n ] && f1=$n
          # a piece that comes out short is drawn once more; the last lines of what went wrong come back as an annotation
          # (this workspace can't read Actions logs, only annotations)
          got=0
          for try in 1 2; do
            rm -rf test/out/v151_frames
            (cd test && VIDEO=1 NOSOUND=1 NOENC=1 F0=$f0 F1=$f1 timeout 100m python3 v151_intro.py > ../draw.log 2>&1) || true
            got=$(ls test/out/v151_frames 2>/dev/null | wc -l); echo "try $try: frames $got of $((f1-f0))"; grep -vE '^frame ' draw.log | tail -25
            [ "$got" -eq $((f1-f0)) ] && break
            echo "::warning title=piece ${{ matrix.seg }} try $try::frames $got of $((f1-f0)) | $(grep -vE '^frame |^ok ' draw.log | tail -14 | tr '\n' '|' | cut -c1-1500)"
          done
          [ "$got" -eq $((f1-f0)) ] || { echo "::error title=piece ${{ matrix.seg }}::frames $got of $((f1-f0))"; exit 1; }
          mkdir -p piece
          ffmpeg -y -loglevel error -framerate $FPS -start_number $f0 -i test/out/v151_frames/f%05d.jpg -frames:v $((f1-f0)) \
            -c:v libx264 -pix_fmt yuv420p -crf 20 -preset medium -g 48 -r $FPS piece/s$(printf %03d ${{ matrix.seg }}).mp4
      - uses: actions/upload-artifact@v4
        with: {name: 'piece-${{ matrix.seg }}', path: piece/*.mp4, retention-days: 3}
  sound:
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: .github/workflows/render.yml}
      - name: Cache Chromium
        uses: actions/cache@v4
        with: {path: ~/.cache/ms-playwright, key: pw-chromium-v1}
      - name: Install Playwright + Chromium
        timeout-minutes: 25
        run: |
          pip install playwright pillow numpy scipy
          for i in 1 2 3; do timeout 8m python -m playwright install --with-deps chromium && break; echo "::warning::browser install try $i timed out"; sleep 5; done
      - name: Build
        run: ./build.sh
      - name: Sound
        run: cd test && VIDEO=1 NOENC=1 F0=0 F1=0 python3 v151_intro.py 2>&1 | tail -20 && test -s out/v151_sound.wav
      - uses: actions/upload-artifact@v4
        with: {name: sound, path: test/out/v151_sound.wav, retention-days: 3}
  join:
    needs: [plan, render, sound]
    if: always() && needs.plan.result == 'success' && needs.sound.result == 'success'   # also after failed pieces: it keeps the good ones
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with: {path: segs, key: intro-segs-none, restore-keys: intro-segs-}
      - uses: actions/download-artifact@v4
        with: {pattern: 'piece-*', merge-multiple: true, path: new}
      - uses: actions/download-artifact@v4
        with: {name: sound, path: snd}
      - name: Join
        id: j
        env: {N: '${{ needs.plan.outputs.n }}', NSEG: '${{ needs.plan.outputs.nseg }}'}
        run: |
          command -v ffprobe >/dev/null || (timeout 10m sudo apt-get update -q && timeout 10m sudo apt-get install -yq ffmpeg)
          python3 tools/render_join.py > join.txt 2>&1 || true; cat join.txt; msg=$(tail -1 join.txt)
          if [ -s out/intro.mp4 ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; echo "::notice title=Render::$msg; drew pieces ${{ needs.plan.outputs.segs }}"
          else echo "::error title=Render::$msg"; fi
      - uses: actions/cache/save@v4
        if: always()
        with: {path: segs, key: 'intro-segs-${{ github.run_id }}-${{ github.run_attempt }}'}
      - name: Send the video back (branch render-out/intro)
        if: steps.j.outputs.ok == '1'
        run: |
          cd out && cp ../.render-request req.json 2>/dev/null || true
          git init -q && git checkout -q -b r && git add intro.mp4 req.json
          git -c user.name=render-bot -c user.email=actions@github.com commit -qm "intro render of ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" r:refs/heads/render-out/intro
      - name: Not all pieces drawn
        if: steps.j.outputs.ok != '1'
        run: exit 1
