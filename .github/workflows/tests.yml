# Tests on GitHub Actions (back on since Oct 25 2026: the repo is public, so Actions minutes are free).
# Every test of the suite runs as its own job, in parallel, in fast mode (test/fast.py), same pass/fail rules as run_suite.py.
# A failed test runs once more (ci_run.py, CI_RETRY=1): a pass on the second try counts, listed as "PASS (retry)" (a flaky test).
#   - push to a branch named ci/<anything>  -> full suite on that commit (tools/ci.sh does this and waits for the result)
#   - Actions -> Tests -> Run workflow      -> pick smoke, changed (vs main) or full, on any branch; optionally only some tests
# The last job ("summary") lists every test as PASS / FAIL in one annotation titled "Results", which tools/ci.sh prints
# (the session workspace can't download Actions logs or artifacts, only read annotations through the API).
# Runners are pinned to ubuntu-24.04: ubuntu-latest moves to Ubuntu 26 from Oct 2026, which may break the browser install.
name: Tests
on:
  push:
    branches: ['ci/**']
  workflow_dispatch:
    inputs:
      suite:
        description: smoke, changed (vs main) or full
        default: full
        type: choice
        options: [smoke, changed, full]
      only:
        description: optional test files to run from that suite, space separated (e.g. v57t.py v60t.py)
        default: ''
concurrency:
  group: tests-${{ github.ref }}-${{ github.event.inputs.suite || 'full' }}
  cancel-in-progress: true
env:
  SUITE: ${{ github.event.inputs.suite || 'full' }}
jobs:
  list:
    runs-on: ubuntu-24.04
    outputs:
      tests: ${{ steps.l.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: l
        env: {ONLY: '${{ github.event.inputs.only }}'}
        run: |
          git fetch -q origin main || true
          echo "tests=$(python3 test/run_suite.py "$SUITE" --json $ONLY)" >> "$GITHUB_OUTPUT"
  test:
    needs: list
    if: needs.list.outputs.tests != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 100   # a failed test runs once more (ci_run.py, CI_RETRY)
    strategy:
      fail-fast: false
      matrix:
        t: ${{ fromJSON(needs.list.outputs.tests) }}
    env:
      FAST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: .github/workflows/tests.yml}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Cache Chromium
        uses: actions/cache@v4
        with: {path: ~/.cache/ms-playwright, key: pw-chromium-v1}
      - name: Install Playwright + Chromium
        timeout-minutes: 25   # it once hung for the job's whole hour; now each try is cut off and tried again
        run: |
          pip install playwright pillow numpy scipy
          for i in 1 2 3; do timeout 420 python -m playwright install --with-deps chromium && exit 0; echo "::warning::browser install try $i failed or hung; trying again"; sleep 5; done; exit 1
      - name: Build
        run: ./build.sh && ./viewer/build_viewer.sh
      - name: Run ${{ matrix.t }}
        id: run
        run: |
          set -o pipefail
          cd test && python3 ci_run.py "${{ matrix.t }}" 2>&1 | tee out/ci_log.txt
      - name: Result
        if: always()
        run: |
          mkdir -p res && n=$(echo "${{ matrix.t }}" | awk '{print $NF}')
          tail=$(grep -E '^(====|  FAIL)' test/out/ci_log.txt 2>/dev/null | head -8 | tr '\n' ' ' | cut -c1-500)
          r="${{ steps.run.outcome == 'success' && 'PASS' || 'FAIL' }}"; grep -q 'passed on retry' test/out/ci_log.txt 2>/dev/null && r="PASS (retry)"
          echo "$r ${{ matrix.t }}  ${tail}" > res/$n.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: res-${{ strategy.job-index }}
          path: res/*.txt
          retention-days: 7
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ strategy.job-index }}
          path: test/out/*.png
          if-no-files-found: ignore
          retention-days: 7
  summary:
    needs: [list, test]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: res-*, merge-multiple: true, path: res}
      - name: Summary
        run: |
          total=$(echo '${{ needs.list.outputs.tests }}' | python3 -c 'import sys,json;print(len(json.load(sys.stdin)))')
          cat res/*.txt 2>/dev/null | sort > all.txt || true
          pass=$(grep -c '^PASS' all.txt || true); bad=$(grep '^FAIL' all.txt || true)
          rt=$(grep -c '^PASS (retry)' all.txt || true)
          head="$SUITE: $pass/$total passed"; [ "$rt" -gt 0 ] && head="$head ($rt only on a second try)"
          { echo "## $head"; echo '```'; cat all.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "$head"; cat all.txt
          python3 -c 'import sys;t=sys.stdin.read().strip().replace("%","%25").replace("\r","").replace("\n","%0A");print("::notice title=Results::"+t)' < all.txt
          if [ "$pass" != "$total" ]; then echo "::error title=Suite $SUITE::$head"; exit 1; fi
          echo "::notice title=Suite $SUITE::$head"
