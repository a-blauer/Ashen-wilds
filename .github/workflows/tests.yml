# PAUSED (Oct 2026): GitHub Actions minutes were nearly used up, so tests no longer run here automatically.
# Tests now run in the Claude session workspace: `cd test && python3 run_suite.py smoke|full` (see CLAUDE.md).
# This file stays only as a manual fallback (Actions → Tests → Run workflow); don't trigger it unless the owner asks.
name: Tests
on:
  workflow_dispatch:
    inputs:
      suite:
        description: smoke or full
        default: full
        type: choice
        options: [smoke, full]
concurrency:
  group: tests-${{ github.ref }}-${{ github.event.inputs.suite || 'smoke' }}
  cancel-in-progress: true
jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.l.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
      - id: l
        run: |
          f=test/${{ github.event.inputs.suite || 'smoke' }}.txt
          echo "tests=$(grep -v '^#' $f | grep . | python3 -c 'import sys,json;print(json.dumps([l.strip() for l in sys.stdin]))')" >> "$GITHUB_OUTPUT"
  test:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        t: ${{ fromJSON(needs.list.outputs.tests) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Install Playwright + Chromium
        run: pip install playwright pillow && python -m playwright install --with-deps chromium
      - name: Build
        run: ./build.sh && ./viewer/build_viewer.sh
      - name: Run ${{ matrix.t }}
        run: cd test && python3 ci_run.py "${{ matrix.t }}"
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ strategy.job-index }}
          path: test/out/*.png
          if-no-files-found: ignore
          retention-days: 7
